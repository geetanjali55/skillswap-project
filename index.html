<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SkillSwap - Skill Input & Profile Setup</title>
  <link rel="stylesheet" href="styles/style.css" />
  <style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background-color: #FAF9F6; /* Creamy white */
    color: #2F5755; /* Deep teal */
    overflow-x: hidden;
  }

  .floating-brain {
    position: fixed;
    top: 100px;
    right: 40px;
    width: 120px;
    z-index: 5;
    transition: transform 0.3s ease, filter 0.3s ease;
    filter: drop-shadow(0 0 5px rgba(47, 87, 85, 0.3));
    animation: gentleWiggle 5s ease-in-out infinite;
  }

  .floating-brain:hover {
    transform: rotate(5deg) scale(1.1);
    filter: drop-shadow(0 0 10px rgba(47, 87, 85, 0.5));
  }

  @keyframes gentleWiggle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  .hero-section {
    width: 100vw;
    background: linear-gradient(135deg, #FDFBF4 0%, #E8F1EE 100%);
    color: #2F5755;
    padding: 3rem 1rem 4rem;
    box-shadow: 0 8px 25px rgba(47, 87, 85, 0.15);
    border-radius: 0 0 20px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .hero-section h1 {
    font-size: 2.5rem;
    margin-bottom: 1rem;
    font-weight: 800;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.05);
  }

  .hero-section p {
    font-size: 1.25rem;
    margin-bottom: 2rem;
    font-weight: 600;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.05);
  }

  .hero-buttons button {
    background: #ffffff;
    color: #2F5755;
    font-weight: 700;
    border: 2px solid #2F5755;
    border-radius: 30px;
    padding: 0.75rem 2rem;
    margin: 0 0.5rem;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 3px 7px rgba(47, 87, 85, 0.2);
    transition: background 0.3s ease, color 0.3s ease;
  }

  .hero-buttons button:hover {
    background: #2F5755;
    color: #ffffff;
    box-shadow: 0 6px 15px rgba(47, 87, 85, 0.3);
  }

  #form-section,
  #recommendations,
  #saved-profiles {
    max-width: 600px;
    margin: 3rem auto 0;
    background: #ffffff;
    color: #2F5755;
    padding: 2rem;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    text-align: left;
    position: relative;
    z-index: 2;
  }

  #form-section h2 {
    color: #2F5755;
    margin-bottom: 1rem;
    font-weight: 700;
  }

  #recommendations h3,
  #saved-profiles h3 {
    color: #2F5755;
    margin-bottom: 1rem;
    font-weight: 700;
  }

  #search-filter {
    width: 100%;
    padding: 0.5rem 1rem;
    font-size: 1rem;
    border: 1px solid #DCDCDC;
    border-radius: 10px;
    margin-bottom: 1rem;
  }

  .recommendations-grid,
  #saved-profiles-list {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .user-card {
    background: #ffffff;
    border: 1px solid #DCDCDC;
    border-radius: 10px;
    padding: 1rem;
    flex: 1 1 250px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    position: relative;
  }

  .side-quotes {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }

  .side-quote {
    position: absolute;
    font-size: 2.5rem;
    font-weight: 600;
    color: rgba(47, 87, 85, 0.08);
    font-family: 'Segoe UI', sans-serif;
    white-space: nowrap;
    transition: transform 0.3s ease-out;
    user-select: none;
    text-shadow: 0 0 10px rgba(0, 0, 0, 0.02);
  }

  .side-quote:nth-child(1) { font-size: 3rem; color: rgba(47, 87, 85, 0.08); }
  .side-quote:nth-child(2) { font-size: 2.3rem; color: rgba(0, 0, 0, 0.05); }
  .side-quote:nth-child(3) { font-size: 2.6rem; color: rgba(47, 87, 85, 0.06); }
</style>

</head>

<body>

  <!-- Floating Brain Icon -->
  <img
    src="https://tse4.mm.bing.net/th/id/OIP.p81Ig9UBzOwOV8Im3JmN4AHaHa?pid=Api&P=0&h=180"
    alt="Brain Icon"
    class="floating-brain"
    title="Brain Power! Hover me!"
  />

  <!-- Background Side Quotes -->
  <div class="side-quotes">
    <span class="side-quote" style="top: 15%; left: 5%;">“Learning never exhausts the mind.”</span>
    <span class="side-quote" style="top: 40%; right: 6%;">“Education is the most powerful weapon.”</span>
    <span class="side-quote" style="top: 75%; left: 8%;">“An investment in knowledge pays the best interest.”</span>
  </div>

  <!-- Hero / Welcome Section at the Top - full width -->
  <section class="hero-section">
    <div class="content-wrapper">
      <h1>Welcome to SkillSwap 🌱</h1>
      <p>Connect. Learn. Teach. Grow.</p>
      <div class="hero-buttons">
        <button onclick="scrollToSection('form-section')">Get Started</button>
        <button onclick="scrollToSection('saved-profiles')">Saved Profiles</button>
        <button onclick="scrollToSection('recommendations')">Browse Swaps</button>
      </div>
    </div>

    <!-- Moved inside hero -->
    <section id="form-section" class="envelope-container">
      <div class="envelope">
        <div class="body">
          <div class="card" tabindex="0">
            <h2>Fill your Skill Journey 🚀</h2>
            <form id="profile-form" autocomplete="off">
              <label for="name">Your Name</label>
              <input type="text" id="name" name="name" required />

              <label for="skill-offer">Skill You Offer</label>
              <input type="text" id="skill-offer" name="skillOffer" required />

              <label for="skill-want">Skill You Want to Learn</label>
              <input type="text" id="skill-want" name="skillWant" required />

              <label for="location">Location (City)</label>
              <input type="text" id="location" name="location" required />

              <label for="email">Your Email</label>
              <input type="email" id="email" name="email" required />

              <button type="submit" class="send-btn">✉️ Send</button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <section id="recommendations" class="recommendations-section">
      <h3>Find Available Skill Swaps</h3>
      <input type="search" id="search-filter" placeholder="Search by skill or name..." />
      <div class="recommendations-grid"></div>
    </section>

    <section id="saved-profiles" class="saved-profiles-section">
      <h3>Saved Profiles for Later</h3>
      <div id="saved-profiles-list" class="recommendations-grid"></div>
    </section>

  </section>

  <!-- JavaScript for scroll parallax effect on quotes -->
  <script>
    window.addEventListener("scroll", () => {
      const scrollY = window.scrollY;
      const quotes = document.querySelectorAll(".side-quote");
      quotes.forEach((quote, i) => {
        const speed = (i + 1) * 0.15;
        quote.style.transform = `translateY(${scrollY * speed}px)`;
      });
    });

    function scrollToSection(id) {
      const el = document.getElementById(id);
      if (el) {
        el.scrollIntoView({ behavior: "smooth" });
      }
    }
  </script>

  <script src="scripts/main.js"></script>
</body>
</html>
